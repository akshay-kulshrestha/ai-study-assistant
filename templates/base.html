<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Study Assistant{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230d9488'/><stop offset='1' stop-color='%232563eb'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><path d='M28 40 L50 28 L72 40 L50 52 Z' fill='white'/><path d='M35 46 V64 Q50 74 65 64 V46' stroke='white' stroke-width='6' fill='none' stroke-linecap='round'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.js" crossorigin="anonymous"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="topbar">
        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-mark"><i data-lucide="graduation-cap" class="icon" aria-hidden="true" style="width:19px;height:19px;color:#fff;"></i></span>
            <span class="brand-text-block">
                <span class="b1">AI Study</span>
                <span class="b2 gradient-text">Assistant</span>
            </span>
        </a>
        <nav aria-label="Main">
            <a href="{{ url_for('library_page') }}" class="btn-secondary" {{ 'aria-current="page"' | safe if current_page == 'library' else '' }}>
                <i data-lucide="book-open" class="icon" aria-hidden="true" style="width:16px;height:16px;"></i>
                <span>Library</span>
            </a>
            <a href="{{ url_for('upload_page') }}" class="btn-primary" {{ 'aria-current="page"' | safe if current_page == 'upload' else '' }}>
                <i data-lucide="upload" class="icon" aria-hidden="true" style="width:16px;height:16px;"></i>
                <span>Upload</span>
            </a>
        </nav>
    </header>
    <main id="main-content" tabindex="-1" class="container{{ ' wide' if current_page in ('study', 'library') else '' }}">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-brand"><i data-lucide="graduation-cap" class="icon" aria-hidden="true" style="width:16px;height:16px;"></i>AI Study Assistant</span>
            <span class="footer-tagline">All study tools grounded in your documents.</span>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
    <script>
        if (window.lucide) { lucide.createIcons(); }
    </script>
</body>
</html>
